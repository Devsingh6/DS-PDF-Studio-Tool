name: Import uploaded source ZIP

on:
  push:
    paths:
      - "DS-PDF-Studio-Tool-v1.7.0.zip"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract and install source files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="DS-PDF-Studio-Tool-v1.7.0.zip"
          test -f "$ZIP"
          mkdir -p /tmp/ds-pdf-source
          unzip -q "$ZIP" -d /tmp/ds-pdf-source
          ROOT="$(find /tmp/ds-pdf-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          # Preserve the repository's existing GitHub Actions workflows.
          rsync -a --exclude='.git/' --exclude='.github/' "$ROOT/" ./
          rm -f "$ZIP"

      - name: Commit imported project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import DS PDF Studio Tool v1.7.0 source"
          git push origin HEAD:main
