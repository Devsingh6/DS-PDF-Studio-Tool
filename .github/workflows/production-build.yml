name: DS PDF Studio Tool - Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-pdf-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-production-build:
    name: Install dependencies and build Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source layout
        run: |
          test -f frontend/package.json
          test -f frontend/vite.config.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build and verify production bundle
        working-directory: frontend
        run: npm run build:verify

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: ds-pdf-studio-v1.7.0-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

  backend-smoke-tests:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend source availability
        id: backend-source
        shell: bash
        run: |
          if [[ -f backend/requirements.txt && -f tests/test_api_smoke.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend smoke tests were not run because backend/requirements.txt and/or tests/test_api_smoke.py are missing from this repository. Add the v1.7.0 backend source to enable these tests."
          fi

      - name: Install backend dependencies
        if: steps.backend-source.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run backend smoke tests
        if: steps.backend-source.outputs.available == 'true'
        run: python -m pytest tests/test_api_smoke.py -q
